name: Release

# Started by hand for a tag: Actions -> Release -> Run workflow, TestPyPI first, then PyPI.
# Trusted publishing (OpenID Connect) needs no token in the repository; the owner of the
# project on each index registers this repository and workflow once (CONTRIBUTING, section 10).
on:
  workflow_dispatch:
    inputs:
      index:
        description: Where to publish
        type: choice
        options: [testpypi, pypi]
        default: testpypi

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version="v$(poetry version --short)"
          test "$GITHUB_REF_NAME" = "$version" || { echo "run it for tag $version"; exit 1; }
      - run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.index }}
      url: ${{ inputs.index == 'pypi' && 'https://pypi.org/p/ranklens' || 'https://test.pypi.org/p/ranklens' }}
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: ${{ inputs.index == 'pypi' && 'https://upload.pypi.org/legacy/' || 'https://test.pypi.org/legacy/' }}
