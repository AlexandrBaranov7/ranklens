name: Release

# A rehearsal on TestPyPI, started by hand for a tag: Actions -> Release -> Run workflow.
# Trusted publishing (OpenID Connect) needs no token in the repository; the owner of the
# TestPyPI project registers this repository and workflow once (CONTRIBUTING, section 10).
on:
  workflow_dispatch:

permissions:
  contents: read

env:
  POETRY_VERSION: "2.4.3"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: The tag must match the version in pyproject.toml
        run: |
          version="v$(poetry version --short)"
          test "$GITHUB_REF_NAME" = "$version" || { echo "run it for tag $version"; exit 1; }
      - run: poetry build
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  testpypi:
    needs: build
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write  # trusted publishing
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
