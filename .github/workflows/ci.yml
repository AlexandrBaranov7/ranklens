name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  POETRY_VERSION: "2.4.3"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: poetry
      - run: poetry check --lock
      - run: poetry install --only dev --no-root
      - run: poetry run ruff check --output-format=github .
      - run: poetry run ruff format --check .

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: poetry
      - run: poetry install
      - run: poetry run mypy

  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: poetry
      - run: poetry env use python
      - run: poetry install
      # statistical validation runs once, in its own job
      - run: poetry run pytest -m "not slow" --cov --cov-report=term-missing

  statistics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install
      - run: poetry run pytest -m slow

  install:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: poetry build
      - name: Install wheel with plain pip into a clean venv
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install dist/*.whl
          cd /tmp
          /tmp/clean/bin/ranklens --version
          /tmp/clean/bin/python -c "import ranklens, pathlib; assert (pathlib.Path(ranklens.__file__).parent / 'py.typed').exists()"

  # report only: shared runners are too noisy for a hard regression gate (Q-11)
  bench:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install
      - run: >-
          poetry run pytest tests/benchmarks --benchmark-enable --benchmark-only
          --benchmark-columns=mean,stddev,rounds --benchmark-json=benchmark.json
      - uses: actions/upload-artifact@v7
        with:
          name: benchmark
          path: benchmark.json

  docs-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: pipx install "poetry==$POETRY_VERSION"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: poetry
      - run: poetry install
      # --strict: a broken link or a failing example in the docs fails the build
      - run: poetry run mkdocs build --strict
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  docs-deploy:
    needs: docs-build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
